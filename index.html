<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuillets — flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FBF7FF;
  --surface:#FFFFFF;
  --ink:#2A2340;
  --ink-soft:#8A82A8;
  --border:#E7DFFB;
  --brand:#7C5CFF;
  --brand-dark:#5E3FE0;
  --yellow:#FFC145;
  --pink:#FF6B9D;
  --green:#3EC28F;
  --red:#FF6B6B;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 92% 8%, rgba(255,193,69,0.18) 0, transparent 40%),
    radial-gradient(circle at 4% 85%, rgba(124,92,255,0.14) 0, transparent 40%);
  color:var(--ink);
  font-family:'Nunito',sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh;}
h1,h2,.brand,.flashcard-text,.dash-card .name,.deck-header h1{font-family:'Fredoka',sans-serif;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:260px;flex-shrink:0;background:var(--surface);
  border-right:3px solid var(--ink);
  padding:26px 18px;display:flex;flex-direction:column;
}
.brand{font-size:23px;font-weight:700;margin:0 0 2px 0;display:flex;align-items:center;gap:8px;}
.brand-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 26px 0;font-weight:600;}
.nav-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:12px;cursor:pointer;font-size:14.5px;font-weight:700;
  margin-bottom:4px;border:2px solid transparent;color:var(--ink);
}
.nav-item:hover{background:#F5F1FF;}
.nav-item.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.nav-item .count{
  font-size:11.5px;background:var(--surface);color:var(--ink);
  border:2px solid var(--ink);border-radius:20px;padding:1px 8px;font-weight:800;
}
.nav-item.active .count{background:#fff;color:var(--ink);}
.deck-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;flex-shrink:0;border:2px solid var(--ink);}
.deck-name-wrap{display:flex;align-items:center;overflow:hidden;}
.deck-name-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.due-badge{
  font-size:10px;background:var(--red);color:#fff;border-radius:20px;padding:1px 6px;margin-left:6px;font-weight:800;
}
.decks-label{font-size:11.5px;color:var(--ink-soft);margin:20px 0 8px 10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.subject-group{margin-bottom:4px;}
.subject-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;cursor:pointer;font-size:12px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.03em;
}
.subject-header:hover{color:var(--ink);}
.subject-header .chevron{transition:transform .15s ease;font-size:10px;}
.subject-header.collapsed .chevron{transform:rotate(-90deg);}
.subject-header .count{font-size:10.5px;color:var(--ink-soft);font-weight:700;}
.subject-decks.collapsed{display:none;}
.deck-list{flex:1;overflow-y:auto;}
.new-deck-form{margin-top:8px;padding:0 4px;}
.new-deck-form input,.new-deck-form select{
  width:100%;border:2px solid var(--ink);background:var(--surface);
  border-radius:12px;padding:9px 11px;font-size:13.5px;font-family:'Nunito',sans-serif;font-weight:700;
  margin-bottom:8px;
}
.new-deck-form input[list]{background:var(--surface);}
.new-deck-form input::placeholder{color:var(--ink-soft);font-weight:600;}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:2px dashed var(--border);}
.ghost-btn{
  width:100%;background:none;border:2px dashed var(--border);color:var(--ink-soft);
  border-radius:12px;padding:9px;font-size:12.5px;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;
}
.ghost-btn:hover{border-color:var(--brand);color:var(--brand);}

/* ---------- Buttons (chunky sticker style) ---------- */
.btn{
  font-family:'Nunito',sans-serif;font-weight:800;font-size:13.5px;
  padding:10px 18px;border-radius:999px;border:2.5px solid var(--ink);
  background:var(--brand);color:#fff;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s ease, box-shadow .08s ease;
}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.btn.secondary{background:var(--surface);color:var(--ink);}
.btn.danger{background:var(--red);}
.btn:disabled{opacity:.4;cursor:default;box-shadow:2px 2px 0 var(--ink);}

/* ---------- Main ---------- */
.main{flex:1;padding:40px 48px;max-width:920px;}
h1{font-weight:600;font-size:32px;margin:0 0 4px 0;}
.subtitle{color:var(--ink-soft);font-size:14.5px;margin:0 0 30px 0;font-weight:700;}

/* dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:6px;}
.dash-card{
  background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;
  padding:0;cursor:pointer;overflow:hidden;
  box-shadow:4px 4px 0 var(--ink);
  transition:transform .1s ease, box-shadow .1s ease;
}
.dash-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.dash-card .color-bar{height:54px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.dash-card .body{padding:14px 16px 16px;}
.dash-card .name{font-size:18px;margin-bottom:8px;font-weight:600;}
.dash-card .stats{display:flex;gap:12px;font-size:12.5px;color:var(--ink-soft);font-weight:800;}
.dash-card .stats b{color:var(--ink);}
.empty-state{
  border:2.5px dashed var(--border);border-radius:20px;padding:50px 30px;
  text-align:center;color:var(--ink-soft);margin-top:20px;font-weight:700;font-size:15px;
}

/* deck view */
.deck-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.deck-title-row{display:flex;align-items:center;gap:12px;}
.deck-emoji-badge{
  width:46px;height:46px;border-radius:14px;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.deck-actions{display:flex;gap:8px;}
.card-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 16px;border:2px solid var(--border);border-radius:14px;
  background:var(--surface);margin-bottom:9px;
}
.card-row:hover{border-color:var(--ink);}
.card-row .front-text{font-size:14px;max-width:68%;font-weight:700;}
.card-row .meta{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
.tag{
  display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;
  background:#F0EAFF;color:var(--brand-dark);margin-right:8px;border:1.5px solid var(--brand);
}
.tag-chip{
  display:inline-block;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:20px;
  background:var(--surface);color:var(--ink);margin:0 8px 8px 0;border:2px solid var(--border);cursor:pointer;
}
.tag-chip:hover{border-color:var(--ink);}
.tag-chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tag-chip .n{color:var(--ink-soft);font-weight:700;margin-left:4px;}
.tag-chip.active .n{color:#cfc7f0;}
.tag-filter-row{margin-bottom:16px;}
.deck-badge{
  font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;margin-right:8px;
  background:#F0EAFF;color:var(--brand-dark);border:1.5px solid var(--brand);
}

/* forms */
.panel{background:var(--surface);border:2.5px solid var(--ink);border-radius:20px;padding:22px;margin-bottom:22px;box-shadow:4px 4px 0 var(--ink);}
.field-label{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;display:block;font-weight:800;}
textarea,input[type=text]{
  width:100%;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;
  border:2px solid var(--border);border-radius:12px;
  padding:10px 12px;background:#FDFCFF;resize:vertical;
}
textarea:focus,input:focus{outline:none;border-color:var(--brand);}
textarea{min-height:72px;}
.type-toggle{display:flex;gap:8px;margin-bottom:18px;}
.type-toggle button{
  flex:1;padding:9px;border-radius:12px;border:2px solid var(--border);
  background:#FDFCFF;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink-soft);
}
.type-toggle button.active{border-color:var(--brand);color:var(--brand-dark);background:#F0EAFF;}
.form-row{margin-bottom:16px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;font-weight:700;}

/* study */
.study-wrap{display:flex;flex-direction:column;align-items:center;padding-top:14px;}
.study-progress{font-size:13.5px;color:var(--ink-soft);margin-bottom:20px;font-weight:800;}
.flip-scene{width:100%;max-width:600px;perspective:1400px;}
.flip-card{
  width:100%;min-height:280px;position:relative;cursor:pointer;
}
.flip-inner{
  position:relative;width:100%;min-height:280px;transition:transform .5s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flip-inner.flipped{transform:rotateY(180deg);}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;
  background:var(--surface);border:3px solid var(--ink);border-radius:22px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;
  box-shadow:6px 6px 0 var(--ink);
}
.flip-face.back{transform:rotateY(180deg);background:#F5F1FF;}
.flip-face .label{position:absolute;top:16px;left:20px;font-size:11px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.flashcard-text{font-size:24px;line-height:1.5;font-weight:500;}
.flashcard-text .blank{display:inline-block;border-bottom:3px solid var(--yellow);min-width:60px;}
.flashcard-text .revealed{color:var(--brand-dark);font-weight:600;}
.flip-hint{font-size:12.5px;color:var(--ink-soft);margin-top:16px;font-weight:700;}
.grade-row{display:flex;gap:10px;margin-top:24px;width:100%;max-width:600px;}
.grade-btn{
  flex:1;padding:13px 6px;border-radius:16px;border:2.5px solid var(--ink);
  background:var(--surface);font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;
  box-shadow:3px 3px 0 var(--ink);transition:transform .08s ease, box-shadow .08s ease;
}
.grade-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
.grade-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.grade-btn .lbl{display:block;font-size:13.5px;font-weight:800;}
.grade-btn .sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:700;}
.grade-btn.again{background:#FFECEC;}
.grade-btn.hard{background:#FFF6E0;}
.grade-btn.good{background:#E9FFF3;}
.grade-btn.easy{background:#EFEAFF;}
.done-state{text-align:center;padding:70px 20px;}
.done-state .big{font-size:28px;margin-bottom:8px;font-weight:600;}
.done-emoji{font-size:52px;margin-bottom:14px;}

.back-link{font-size:13px;color:var(--ink-soft);cursor:pointer;margin-bottom:16px;display:inline-block;font-weight:700;}
.back-link:hover{color:var(--brand-dark);}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  border:2px solid var(--ink);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.icon-x{cursor:pointer;color:var(--ink-soft);font-size:15px;font-weight:800;}
.icon-x:hover{color:var(--red);}

.confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50;}
.confetti-piece{position:absolute;font-size:20px;animation:confetti-fall 1.1s ease-out forwards;}
@keyframes confetti-fall{
  0%{opacity:1;transform:translateY(0) rotate(0deg);}
  100%{opacity:0;transform:translateY(140px) rotate(320deg);}
}

/* ---------- Auth screen ---------- */
.auth-screen{
  min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 92% 8%, rgba(255,193,69,0.18) 0, transparent 40%),
    radial-gradient(circle at 4% 85%, rgba(124,92,255,0.14) 0, transparent 40%);
}
.auth-box{
  width:100%;max-width:380px;background:var(--surface);border:2.5px solid var(--ink);
  border-radius:22px;padding:32px;box-shadow:6px 6px 0 var(--ink);
}
.auth-box .brand{justify-content:center;margin-bottom:4px;font-size:26px;}
.auth-box .brand-sub{text-align:center;margin-bottom:26px;}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;}
.auth-tabs button{
  flex:1;padding:9px;border-radius:12px;border:2px solid var(--border);
  background:#FDFCFF;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;color:var(--ink-soft);
}
.auth-tabs button.active{border-color:var(--brand);color:var(--brand-dark);background:#F0EAFF;}
.auth-box input{
  width:100%;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;
  border:2px solid var(--border);border-radius:12px;
  padding:11px 13px;background:#FDFCFF;margin-bottom:12px;
}
.auth-box input:focus{outline:none;border-color:var(--brand);}
.auth-box .btn{width:100%;justify-content:center;padding:11px;}
.auth-error{color:var(--danger,var(--red));font-size:12.5px;font-weight:700;margin-bottom:12px;}
.auth-hint{font-size:12px;color:var(--ink-soft);margin-top:16px;text-align:center;font-weight:600;}
.auth-loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-weight:700;}
.sync-badge{
  font-size:11px;color:var(--ink-soft);font-weight:700;display:flex;align-items:center;gap:5px;
  padding:6px 4px;
}
.sync-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.sync-badge.syncing .dot{background:var(--yellow);}
.sync-badge.error .dot{background:var(--red);}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="confetti-layer" id="confetti"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
/* ==== CONFIGURATION SUPABASE — à remplacer par tes propres clés ==== */
const SUPABASE_URL = 'https://ikloossdcosfxvssxizz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrbG9vc3NkY29zZnh2c3N4aXp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzY0MDIsImV4cCI6MjEwMzkxMjQwMn0.BJ5zI7rn8NCZEPg9ez1Q1A1w4VzOgxB_MIgnxAMvB0E';
/* ==================================================================== */

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORAGE_KEY = 'feuillets-data';
let state = { decks: [], cards: [] };
let view = { page: 'dashboard', deckId: null, studyQueue: [], studyIndex: 0, revealed: false, cardType: 'basic', activeTag: null, tagViewTag: null, collapsedSubjects: [], editingDeckId: null, editingCardId: null };
let auth = { session: null, mode:'signin', error:'', loading:true };
let syncStatus = 'idle'; // idle | syncing | error

const DECK_COLORS = ['#FF6B9D','#FFC145','#3EC28F','#7C5CFF','#5B9BD5','#FF9F5A','#6BCB77','#FF6B6B'];
const DECK_EMOJIS = ['📚','🧠','🌿','⚡','🍎','🔬','✨','🧬','🌊','🔥','🎯','🌱'];
const CELEBRATIONS = ['Nickel !','Tu assures !','Bien joué !','En pleine forme !','Ça rentre !'];

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function todayISO(){ return new Date().toISOString(); }
function daysFromNow(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString(); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

async function loadData(){
  try{
    const { data, error } = await supabaseClient
      .from('app_state')
      .select('data')
      .eq('user_id', auth.session.user.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data){ state = data.data; }
    else { state = { decks: [], cards: [] }; }
  }catch(e){
    showToast("Impossible de charger tes données");
    console.error(e);
  }
  renderApp();
}
async function saveData(){
  syncStatus = 'syncing'; renderApp();
  try{
    const { error } = await supabaseClient
      .from('app_state')
      .upsert({ user_id: auth.session.user.id, data: state, updated_at: new Date().toISOString() });
    if(error) throw error;
    syncStatus = 'idle';
  }catch(e){
    syncStatus = 'error';
    showToast("Erreur de synchronisation");
    console.error(e);
  }
  renderApp();
}
function showToast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms || 1700);
}
function burstConfetti(x, y){
  const layer = document.getElementById('confetti');
  const bits = ['✨','🎉','⭐','💫','🌟'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.className='confetti-piece';
    s.textContent = pick(bits);
    s.style.left = (x + (Math.random()*160-80)) + 'px';
    s.style.top = (y + (Math.random()*20-10)) + 'px';
    s.style.animationDelay = (Math.random()*0.15)+'s';
    layer.appendChild(s);
    setTimeout(()=>s.remove(), 1300);
  }
}

function cardsForDeck(deckId){ return state.cards.filter(c=>c.deckId===deckId); }
function dueCards(deckId){
  const now = new Date();
  return cardsForDeck(deckId).filter(c => !c.dueDate || new Date(c.dueDate) <= now);
}
function totalDue(){
  const now = new Date();
  return state.cards.filter(c => !c.dueDate || new Date(c.dueDate) <= now).length;
}

function parseCloze(text){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let front = esc(text).replace(/\{\{(.*?)\}\}/g, '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
  let back = esc(text).replace(/\{\{(.*?)\}\}/g, '<span class="revealed">$1</span>');
  return {front, back};
}
function stripCloze(text){ return text.replace(/\{\{(.*?)\}\}/g,'$1'); }
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function allTags(){
  const map = {};
  state.cards.forEach(c=>(c.tags||[]).forEach(t=>{ map[t]=(map[t]||0)+1; }));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}
function cardsWithTag(tag){ return state.cards.filter(c=>(c.tags||[]).includes(tag)); }
function allSubjects(){
  const set = new Set(state.decks.map(d=>d.subject||'Sans matière'));
  return Array.from(set).sort((a,b)=>a==='Sans matière'?1:b==='Sans matière'?-1:a.localeCompare(b));
}
function decksBySubject(subject){
  return state.decks.filter(d=>(d.subject||'Sans matière')===subject);
}

/* ---------- Auth ---------- */
function render(){
  const app = document.getElementById('app');
  if(auth.loading){
    app.innerHTML = `<div class="auth-screen"><div class="auth-loading">Chargement… 🌿</div></div>`;
    return;
  }
  if(!auth.session){
    app.innerHTML = renderAuthScreen();
    return;
  }
  renderApp();
}

function renderAuthScreen(){
  return `
  <div class="auth-screen">
    <div class="auth-box">
      <p class="brand">📇 Feuillets</p>
      <p class="brand-sub">tes cartes, sur tous tes appareils</p>
      <div class="auth-tabs">
        <button class="${auth.mode==='signin'?'active':''}" onclick="setAuthMode('signin')">Se connecter</button>
        <button class="${auth.mode==='signup'?'active':''}" onclick="setAuthMode('signup')">Créer un compte</button>
      </div>
      ${auth.error ? `<p class="auth-error">${escapeHtml(auth.error)}</p>` : ''}
      <input type="email" id="authEmail" placeholder="Email" autocomplete="username">
      <input type="password" id="authPassword" placeholder="Mot de passe" autocomplete="${auth.mode==='signin'?'current-password':'new-password'}" onkeydown="if(event.key==='Enter')submitAuth()">
      <button class="btn" onclick="submitAuth()">${auth.mode==='signin'?'Se connecter':'Créer mon compte'}</button>
      <p class="auth-hint">${auth.mode==='signin' ? "Pas encore de compte ? Clique sur \"Créer un compte\" ci-dessus." : "Utilise le même email/mot de passe sur ton autre appareil pour retrouver tes cartes."}</p>
    </div>
  </div>`;
}

function setAuthMode(mode){ auth.mode = mode; auth.error=''; render(); }

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if(!email || !password){ auth.error='Remplis les deux champs.'; render(); return; }
  auth.error='';
  try{
    if(auth.mode==='signin'){
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if(error) throw error;
      if(data && !data.session){
        auth.error = "Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse, puis reviens te connecter ici.";
        render();
        return;
      }
    }
    // onAuthStateChange se charge de la suite si une session a été créée
  }catch(e){
    auth.error = translateAuthError(e.message);
    render();
  }
}

function translateAuthError(msg){
  if(/invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if(/already registered|already exists/i.test(msg)) return 'Un compte existe déjà avec cet email — connecte-toi plutôt.';
  if(/password.*(least|character)/i.test(msg)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if(/invalid email/i.test(msg)) return 'Email invalide.';
  return msg;
}

async function signOut(){
  await supabaseClient.auth.signOut();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  auth.session = session;
  auth.loading = false;
  if(session){
    loadData();
  } else {
    state = { decks: [], cards: [] };
    render();
  }
});

  }
  const card = state.cards.find(c=>c.id===queue[view.studyIndex]);

  if(card.type==='cloze'){

    frontContent = front; backContent = back;
  } else {

  }
  return `

/* ---------- Actions ---------- */
function goTo(page){ view.page=page; renderApp(); }
function openDeck(id){ view.page='deck'; view.deckId=id; view.cardType='basic'; view.activeTag=null; view.editingDeckId=null; view.editingCardId=null; renderApp(); }
function setCardType(t){ view.cardType=t; renderApp(); }

async function createDeck(){
  const nameInput = document.getElementById('newDeckName');
  const subjectInput = document.getElementById('newDeckSubject');
  const name = nameInput.value.trim();
  const subject = subjectInput.value.trim();
  if(!name) return;
  const usedColors = state.decks.map(d=>d.color);
  const color = DECK_COLORS.find(c=>!usedColors.includes(c)) || pick(DECK_COLORS);
  const emoji = pick(DECK_EMOJIS);
  state.decks.push({id:uid(), name, subject: subject||null, color, emoji, createdAt:todayISO()});
  await saveData();
  nameInput.value=''; subjectInput.value='';
  renderApp();
}

function toggleSubject(subject){
  const i = view.collapsedSubjects.indexOf(subject);
  if(i>=0) view.collapsedSubjects.splice(i,1); else view.collapsedSubjects.push(subject);
  renderApp();
}

async function deleteDeck(id){
  if(!confirm('Supprimer ce paquet et toutes ses cartes ?')) return;
  state.decks = state.decks.filter(d=>d.id!==id);
  state.cards = state.cards.filter(c=>c.deckId!==id);
  await saveData();
  goTo('dashboard');
}

function startEditDeck(deckId){
  view.editingDeckId = deckId;
  renderApp();
}
function cancelEditDeck(){
  view.editingDeckId = null;
  renderApp();
}
async function saveDeckEdit(deckId){
  const deck = state.decks.find(d=>d.id===deckId);
  if(!deck) return;
  const name = document.getElementById('editDeckName').value.trim();
  const subject = document.getElementById('editDeckSubject').value.trim();
  if(!name){ showToast('Le nom du paquet ne peut pas être vide'); return; }
  deck.name = name;
  deck.subject = subject || null;
  view.editingDeckId = null;
  await saveData();
  renderApp();
  showToast('Paquet mis à jour ✅');
}

async function addCard(deckId){
  let card = {id:uid(), deckId, ease:2.5, interval:0, reps:0, dueDate:null};
  if(view.cardType==='basic'){
    const front = document.getElementById('fFront').value.trim();
    const back = document.getElementById('fBack').value.trim();
    if(!front || !back){ showToast('Remplis les deux champs 🙂'); return; }
    card.type='basic'; card.front=front; card.back=back;
  } else {
    const text = document.getElementById('fCloze').value.trim();
    if(!text || !text.includes('{{')){ showToast('Ajoute au moins un élément entre {{ }}'); return; }
    card.type='cloze'; card.text=text;
  }
  const tagsRaw = document.getElementById('fTags').value.trim();
  card.tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  state.cards.push(card);
  await saveData();
  renderApp();
  showToast('Carte ajoutée ✨');
}

function toggleDeckTag(tag){
  view.activeTag = (view.activeTag===tag) ? null : tag;
  renderApp();
}
function openTagView(tag){
  view.page='tagView'; view.tagViewTag=tag; renderApp();
}

async function deleteCard(id){
  state.cards = state.cards.filter(c=>c.id!==id);
  await saveData();
  renderApp();
}

function startEditCard(cardId){
  view.editingCardId = cardId;
  renderApp();
}
function cancelEditCard(){
  view.editingCardId = null;
  renderApp();
}
async function saveCardEdit(cardId){
  const card = state.cards.find(c=>c.id===cardId);
  if(!card) return;
  if(card.type==='cloze'){
    const text = document.getElementById('editCloze').value.trim();
    if(!text || !text.includes('{{')){ showToast('Ajoute au moins un élément entre {{ }}'); return; }
    card.text = text;
  } else {
    const front = document.getElementById('editFront').value.trim();
    const back = document.getElementById('editBack').value.trim();
    if(!front || !back){ showToast('Remplis les deux champs 🙂'); return; }
    card.front = front; card.back = back;
  }
  const tagsRaw = document.getElementById('editTags').value.trim();
  card.tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : [];
  view.editingCardId = null;
  await saveData();
  renderApp();
  showToast('Carte mise à jour ✅');
}

function startStudy(deckId){
  view.page='study'; view.deckId=deckId;
  let queue = dueCards(deckId);
  if(view.activeTag) queue = queue.filter(c=>(c.tags||[]).includes(view.activeTag));
  view.studyQueue = queue.map(c=>c.id);
  view.studyIndex = 0; view.revealed=false; view.returnTo='deck';
  renderApp();
}
function startStudyTag(tag){
  const now = new Date();
  const queue = cardsWithTag(tag).filter(c => !c.dueDate || new Date(c.dueDate) <= now);
  view.page='study'; view.studyQueue = queue.map(c=>c.id);
  view.studyIndex = 0; view.revealed=false; view.returnTo='tagView'; view.tagViewTag=tag;
  renderApp();
}
function stopStudy(){ view.returnTo==='tagView' ? openTagView(view.tagViewTag) : openDeck(view.deckId); }
function reveal(){ view.revealed=true; renderApp(); }

async function grade(quality, evt){
  if(quality==='good' || quality==='easy'){
    const rect = evt.target.getBoundingClientRect();
    burstConfetti(rect.left+rect.width/2, rect.top);
    if(Math.random()<0.35) showToast(pick(CELEBRATIONS));
  }
  const card = state.cards.find(c=>c.id===view.studyQueue[view.studyIndex]);
  applySM2(card, quality);
  await saveData();
  view.studyIndex++;
  view.revealed=false;
  renderApp();
}

function applySM2(card, quality){
  card.reps = (card.reps||0)+1;
  let ease = card.ease||2.5;
  let interval = card.interval||0;
  if(quality==='again'){
    interval = 1; ease = Math.max(1.3, ease-0.2);
  } else if(quality==='hard'){
    interval = Math.max(1, Math.round((interval||1)*1.2)); ease = Math.max(1.3, ease-0.15);
  } else if(quality==='good'){
    interval = interval===0 ? 1 : Math.round(interval*ease);
    interval = Math.max(interval, 1);
  } else if(quality==='easy'){
    interval = interval===0 ? 4 : Math.round(interval*ease*1.3);
    ease = ease+0.15;
  }
  card.ease = ease;
  card.interval = interval;
  card.dueDate = daysFromNow(interval);
}

/* ---------- Import / Export ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'feuillets-sauvegarde.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Sauvegarde téléchargée ⬇️');
}
function cardFromImport(c){
  if(!c || typeof c !== 'object') return null;
  const str = v => (v===undefined || v===null) ? '' : String(v).trim();
  const front = str(c.front ?? c.question ?? c.recto ?? c.q);
  const back  = str(c.back ?? c.answer ?? c.reponse ?? c['réponse'] ?? c.verso ?? c.a);
  const clozeSrc = str(c.text ?? c.cloze);
  let tags = c.tags;
  if(typeof tags === 'string') tags = tags.split(',');
  tags = Array.isArray(tags) ? tags.map(t=>String(t).trim()).filter(Boolean) : [];
  if(clozeSrc.includes('{{')) return {type:'cloze', text:clozeSrc, tags};
  if(front.includes('{{') && !back) return {type:'cloze', text:front, tags};
  if(front && back) return {type:'basic', front, back, tags};
  return null;
}

function importData(data){
  const res = {decksAdded:0, cardsAdded:0, cardsSkipped:0, lastDeckId:null};
  const cardKey = c => (c.type==='cloze' ? 'c|'+c.text : 'b|'+c.front).toLowerCase();
  const newDeckMeta = () => {
    const used = state.decks.map(d=>d.color);
    return { color: DECK_COLORS.find(c=>!used.includes(c)) || pick(DECK_COLORS), emoji: pick(DECK_EMOJIS) };
  };

  // 1) Format natif : fichier créé par le bouton "Exporter en JSON" du site
  if(data && !Array.isArray(data) && Array.isArray(data.decks) && Array.isArray(data.cards)){
    data.decks.forEach(d=>{
      if(!d || !d.id) return;
      if(!state.decks.some(x=>x.id===d.id)){
        const meta = newDeckMeta();
        state.decks.push({id:d.id, name:d.name||'Sans titre', subject:d.subject||null, color:d.color||meta.color, emoji:d.emoji||meta.emoji, createdAt:d.createdAt||todayISO()});
        res.decksAdded++;
      }
      res.lastDeckId = d.id;
    });
    data.cards.forEach(c=>{
      if(!c || !c.id || !state.decks.some(d=>d.id===c.deckId)) return;
      if(state.cards.some(x=>x.id===c.id)){ res.cardsSkipped++; return; }
      state.cards.push(c); res.cardsAdded++;
    });
    return res;
  }

  // 2) Format simple : {deck, subject?, cards:[{question, answer, tags}]} ou liste de paquets
  const decks = [];
  const add = (name, subject, raw) => decks.push({
    name: (name===undefined||name===null ? '' : String(name)).trim() || 'Import',
    subject: (subject===undefined||subject===null ? '' : String(subject)).trim(),
    cards: (Array.isArray(raw) ? raw : []).map(cardFromImport).filter(Boolean)
  });
  if(Array.isArray(data)) add('Import', '', data);
  else if(data && Array.isArray(data.decks)) data.decks.forEach(d=>add(d.deck||d.name||d.title, d.subject||d.matiere||d['matière']||data.subject||data.matiere, d.cards));
  else if(data && Array.isArray(data.cards)) add(data.deck||data.name||data.title, data.subject||data.matiere||data['matière'], data.cards);
  else throw new Error('format non reconnu');

  const findDeck = name => state.decks.find(d=>d.name.toLowerCase()===name.toLowerCase());
  const needSubject = decks.filter(d=>d.cards.length && !d.subject && !findDeck(d.name));
  let askedSubject = '';
  if(needSubject.length){
    const known = allSubjects().filter(s=>s!=='Sans matière');
    const label = needSubject.length===1 ? '« '+needSubject[0].name+' »' : 'ces '+needSubject.length+' paquets';
    askedSubject = (window.prompt(
      'Dans quelle matière ranger '+label+' ?'
      + (known.length ? '\nMatières existantes : '+known.join(', ') : '')
      + '\n(Laisse vide pour ne pas en mettre — tu pourras la modifier ensuite.)', '') || '').trim();
  }

  decks.forEach(d=>{
    if(!d.cards.length) return;
    let deck = findDeck(d.name);
    if(!deck){
      const meta = newDeckMeta();
      deck = {id:uid(), name:d.name, subject:(d.subject||askedSubject)||null, color:meta.color, emoji:meta.emoji, createdAt:todayISO()};
      state.decks.push(deck); res.decksAdded++;
    }
    const existing = new Set(state.cards.filter(c=>c.deckId===deck.id).map(cardKey));
    d.cards.forEach(c=>{
      const k = cardKey(c);
      if(existing.has(k)){ res.cardsSkipped++; return; }
      existing.add(k);
      state.cards.push(Object.assign({id:uid(), deckId:deck.id, ease:2.5, interval:0, reps:0, dueDate:null}, c));
      res.cardsAdded++;
    });
    res.lastDeckId = deck.id;
  });
  return res;
}

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  let data;
  try{
    data = JSON.parse(await file.text());
  }catch(err){
    showToast("Fichier illisible : ce n'est pas un JSON valide", 3500);
    e.target.value = ''; return;
  }
  try{
    const res = importData(data);
    if(res.cardsAdded===0 && res.decksAdded===0){
      showToast(res.cardsSkipped>0 ? 'Rien de nouveau : ces cartes sont déjà là' : 'Aucune carte reconnue dans ce fichier', 3500);
    } else {
      await saveData();
      if(res.lastDeckId) openDeck(res.lastDeckId); else goTo('dashboard');
      showToast(res.cardsAdded+' carte'+(res.cardsAdded>1?'s':'')+' importée'+(res.cardsAdded>1?'s':'')+' ✅'
        + (res.cardsSkipped>0 ? ' ('+res.cardsSkipped+' déjà présente'+(res.cardsSkipped>1?'s':'')+' ignorée'+(res.cardsSkipped>1?'s':'')+')' : ''), 4000);
    }
  }catch(err){
    console.error(err);
    showToast('Format non reconnu : il faut une liste « cards » avec question et réponse', 4000);
  }
  e.target.value = '';
});
</script>
